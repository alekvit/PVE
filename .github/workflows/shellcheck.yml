name: ShellCheck Linter 

# Запускать при любом пуше или пул-реквесте в ветку main 
on: 
  push: 
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs: 
  shellcheck: 
    name: Run ShellCheck 
    runs-on: ubuntu-latest 
    
    steps: 
      - name: Debug workspace 
        run: | 
          pwd 
          ls -la 
          echo "--- Hexdump of first 10 bytes ---" 
          hexdump -C ./traefik/traefik-update.sh | head -n 1 
          echo "--- First 10 lines ---" 
          head -n 10 ./traefik/traefik-update.sh
      
      - name: Check file start
        run: |
          echo "--- Начало файла (hexdump) ---"
          hexdump -C ./traefik/traefik-update.sh | head -n 5
          echo "--- Первые 5 строк ---"
          head -n 5 ./traefik/traefik-update.sh

      - name: Checkout repository 
        uses: actions/checkout@v4 
        with: 
          fetch-depth: 0 
          ref: ${{ github.head_ref || github.ref }} 
          clean: force
          
      # 1. Скачиваем код вашего репозитория на виртуальную машину 
     # - name: Checkout repository 
     #   uses: actions/checkout@v4 
      
      # 2. Устанавливаем утилиту ShellCheck 
      - name: Install ShellCheck 
        run: |
          sudo apt-get update 
          sudo apt-get install -y shellcheck 
      
      # 3. Запускаем проверку 
      # '--severity=style' проверяет всё, включая стилистические рекомендации. 
      # Если хотите только ошибки, используйте '--severity=error' 
      - name: Run ShellCheck on shell scripts 
        run: |
          #  find . -name "*.sh" -type f | xargs shellcheck --severity=style
          # Исключаем проблемный файл из поиска
          #find . -name "*.sh" -type f ! -path "./traefik/traefik-update.sh" | xargs shellcheck --severity=style
          # Либо проверяем его отдельно с пониженной строгостью (только ошибки, без стиля)
          #shellcheck --severity=error ./traefik/traefik-update.sh
          find . -name "*.sh" -type f ! -path "./traefik/traefik-update.sh" | xargs shellcheck --severity=style
