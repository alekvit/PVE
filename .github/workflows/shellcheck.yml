name: ShellCheck Linter 

# Запускать при любом пуше или пул-реквесте в ветку main 
on: 
  push: 
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs: 
  shellcheck: 
    name: Run ShellCheck 
    runs-on: ubuntu-latest 
    
    steps:          
      # 1. Скачиваем код вашего репозитория на виртуальную машину 
      - name: Checkout repository 
        uses: actions/checkout@v4 
        with: 
          # Чистим директорию от мусора предыдущих запусков 
          clean: force 
          # Гарантируем, что берем актуальный HEAD 
          ref: ${{ github.head_ref || github.ref }} 
          fetch-depth: 0

      # 2. Отладка: смотрим, что именно скачалось 
      - name: Debug workspace 
        run: | 
          pwd 
          ls -la 
          echo "--- Hexdump of first 10 bytes ---" 
          hexdump -C ./traefik/traefik-update.sh | head -n 1 
          echo "--- Начало файла (hexdump) ---"
          hexdump -C ./traefik/traefik-update.sh | head -n 5
          echo "--- First 10 lines ---" 
          head -n 10 ./traefik/traefik-update.sh
          
      - name: Debug file state 
        run: | 
          echo "Текущая ветка: ${{ github.ref }}" 
          echo "Последний коммит: ${{ github.sha }}" 
          echo "--- Hexdump первой строки (ищем BOM или лишние байты) ---" 
          hexdump -C ./traefik/traefik-update.sh | head -n 1 
          echo "--- Первые 5 строк файла ---" 
          head -n 5 ./traefik/traefik-update.sh 
          echo "--- Права на файл ---" 
          ls -la ./traefik/traefik-update.sh

      # Делаем файл исполняемым 
      - name: Set execute permissions 
        run: chmod +x ./traefik/traefik-update.sh

      - name: Debug file state (after chmod) 
        run: | 
          echo "--- Права на файл (после chmod) ---" 
          ls -la ./traefik/traefik-update.sh 
          echo "--- Поиск исполняемых файлов ---" 
          find . -type f -executable ! -path "./traefik/traefik-update.sh" -not -path "*/.*" | sort
          echo "Поиск по расширениям .sh, .bash, .zsh:"
          find . $ -name "*.sh" -o -name "*.bash" -o -name "*.zsh" $ -type f -not -path "./traefik/traefik-update.sh" -not -path "*/.*" | sort
          echo "--- Поиск исполняемых файлов (кроме скрытых папок) ---" 
          # Добавлено условие -not -path '*/.*/*', чтобы искать скрипты внутри скрытых директорий 
          find . -type f -executable ! -path "./traefik/traefik-update.sh" -not -path "*/.*" -not -path '*/.*/*' | sort
      
      # 2. Устанавливаем утилиту ShellCheck 
      - name: Install ShellCheck 
        run: |
          # Очищаем кэш apt, чтобы не подтянуть старую версию 
          sudo apt-get clean 
          sudo apt-get update -o Acquire::Check-Valid-Until=false -o Acquire::Check-Date=false 
          # --reinstall гарантирует, что мы получим актуальную версию 
          sudo apt-get install --reinstall -y shellcheck 
          shellcheck --version 
      
      # 3. Запускаем проверку 
      # '--severity=style' проверяет всё, включая стилистические рекомендации. 
      # Если хотите только ошибки, используйте '--severity=error' 
      # Проверяем все исполняемые файлы, кроме проблемного 
      #- name: Run ShellCheck on executable scripts 
      #  run: | 
         # find . -type f -executable ! -path "./traefik/traefik-update.sh" -not -path "*/.*" -print0 | xargs -0 shellcheck --severity=style
         # find . -type f -executable ! -path "./traefik/traefik-update.sh" -not -path "*/.*" -not -path '*/.*/*' -print0 | xargs -0 shellcheck --severity=style
      
      # Проверяем сам проблемный файл отдельно (только на ошибки, без стилистических замечаний) 
      - name: Run ShellCheck on traefik-update.sh 
        run: | 
          shellcheck --severity=error ./traefik/traefik-update.sh
      
      - name: Run ShellCheck on shell scripts 
        run: |
          # Собираем список всех .sh файлов, кроме проблемного 
          mapfile -t SCRIPTS < <(find . -name "*.sh" ! -name "traefik-update.sh" -print)
          
          if [ ${#SCRIPTS[@]} -eq 0 ]; then 
            echo "Скрипты для проверки не найдены." 
            exit 0 
          fi 
          
          echo "Найдены скрипты для проверки:" 
          printf '%s\n' "${SCRIPTS[@]}" 
          
          # Передаем их в shellcheck 
          shellcheck --severity=style "${SCRIPTS[@]}"
          
          #find . -name "*.sh" -type f | xargs -0 shellcheck --severity=style
          # Исключаем проблемный файл из поиска
          #find . -name "*.sh" -type f ! -path "./traefik/traefik-update.sh" | xargs shellcheck --severity=style
          
          # Либо проверяем его отдельно с пониженной строгостью (только ошибки, без стиля)
          shellcheck --severity=error ./traefik/traefik-update.sh
         
          #find . -name "*.sh" -type f ! -path "./traefik/traefik-update.sh" | xargs shellcheck --severity=style
